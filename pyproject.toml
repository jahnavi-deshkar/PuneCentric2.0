[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "punecentric"
version = "0.1.0"
description = "Pune multimodal route explorer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "networkx>=3.3,<4.0",
    "osmnx>=2.0,<3.0",
    "geopandas>=1.0,<2.0",
    "shapely>=2.0,<3.0",
    "pandas>=2.2,<4.0",
    "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "requests>=2.32,<3.0", "httpx2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
include = ["app*"]
